# moo nightly: the full matrix on Luau's unmodified suites. Gates nothing; read each morning.
name: nightly

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    paths:
      - "tools/moo-math-oracle/**"
  pull_request:
    paths:
      - "tools/moo-math-oracle/**"

jobs:
  test:
    name: ${{ matrix.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            # gcc 13 raises -Wnonnull false positives in upstream CodeGen, so no -Werror here
            werror: "OFF"
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            werror: "ON"
          - name: macos-arm64
            os: macos-latest
            cc: clang
            cxx: clang++
            werror: "ON"
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLUAU_WERROR=${{ matrix.werror }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: check -ffp-contract=off
        run: grep -q -- "-ffp-contract=off" build/CMakeFiles/Luau.VM.dir/flags.make

      - name: build
        run: cmake --build build -j4 --target Moo.Test Luau.Conformance Luau.UnitTest Luau.CLI.Test Luau.Repl.CLI Luau.Analyze.CLI Luau.Compile.CLI

      - name: moo tests and the determinism suite
        run: build/Moo.Test

      - name: conformance
        run: |
          build/Luau.Conformance
          build/Luau.Conformance -O2

      - name: unit tests
        run: build/Luau.UnitTest

      - name: cli tests
        run: build/Luau.CLI.Test

      - name: moo binaries
        run: |
          build/moo tests/conformance/assert.luau
          build/moo-analyze tests/conformance/assert.luau
          build/moo-compile tests/conformance/assert.luau > /dev/null

      - name: the VM reads no clock
        run: tools/moo-check-no-clock.sh build/libLuau.VM.a

      - name: native codegen is refused
        run: |
          ! build/moo --codegen tests/conformance/assert.luau
          ! build/moo --jit-inliner tests/conformance/assert.luau

  windows-msvc:
    name: windows-msvc
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake -S . -B build -A x64 -DLUAU_WERROR=OFF

      - name: build
        run: cmake --build build --config RelWithDebInfo --parallel 4 --target Moo.Test Luau.Conformance Luau.UnitTest

      - name: moo tests and the determinism suite
        run: build/RelWithDebInfo/Moo.Test.exe

      - name: conformance
        run: build/RelWithDebInfo/Luau.Conformance.exe

      - name: unit tests
        run: build/RelWithDebInfo/Luau.UnitTest.exe

  tla:
    name: tla
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: fetch TLC 1.8.0 (tla2tools)
        run: |
          curl -fsSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar

      - name: model check
        run: tools/moo-tlc.sh "$PWD/tla2tools.jar"

  math-oracle:
    name: math-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: regenerate the CORE-MATH oracle and compare
        run: tools/moo-math-oracle/check.sh
