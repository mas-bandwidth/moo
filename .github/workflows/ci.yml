# moo per-commit gate.
#
# The one-minute rule: the required job, push-gate, builds only Moo.Test (moo's own tests and the
# determinism suite, on the VM and the compiler alone), the VM library and moo-compile, with sccache on the
# GitHub Actions cache, so a commit that changes a VM header rebuilds the VM and nothing else.
# Luau's unmodified suites (Conformance, UnitTest, CLI) run in the full job on pull requests, in
# parallel and not required, and every night on Linux gcc and clang and macOS arm64 (nightly.yml).
# Every job checks that the compiler is deterministic (docs/DETERMINISM.md, 25): Moo.Test compiles the corpus in
# shifting allocation states and against tests/determinism/bytecode.txt, and tools/moo-check-compile.py runs moo-compile
# in separate processes, directories and locales against the same pins.
# Pull requests also run Moo.Test and Conformance in a checked build (MOO_OVERFLOW_ERRORS=ON), with
# gcc and warnings as errors, on macOS and on Windows (MSVC, /WX), each with sccache like the jobs above.
name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"
  # a cache outage never fails a job: the probe step (tools/moo-ci-sccache.sh) drops the launcher when the server
  # cannot start, and a server lost mid-build falls back to the compiler
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  push-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      - name: sccache probe
        id: cache
        shell: bash
        run: tools/moo-ci-sccache.sh

      - name: every upstream change is in docs/PATCHES.md
        run: tools/moo-check-patches.sh

      - name: extern/fixed matches its pin
        run: |
          tools/revendor-fixed.sh --check
          script_pin="$(grep -oE '^FIXED_PIN="[0-9a-f]{40}"' tools/revendor-fixed.sh | grep -oE '[0-9a-f]{40}')"
          grep -q "$script_pin" extern/fixed/NOTES.md

      - name: CHANGELOG.md has a section for MOO_VERSION
        run: tools/moo-release-notes.sh --check-version "v$(sed -n 's/^#define MOO_VERSION "\(.*\)"$/\1/p' VM/include/moo.h)" > /dev/null

      - name: configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLUAU_WERROR=ON
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_LAUNCHER=${{ steps.cache.outputs.launcher }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ steps.cache.outputs.launcher }}

      - name: build
        run: cmake --build build --target Moo.Test Luau.VM Luau.Compile.CLI

      - name: moo tests and the determinism suite
        run: build/Moo.Test

      - name: the compiler across processes, directories and locales
        run: python3 tools/moo-check-compile.py build/moo-compile

      - name: the VM reads no clock
        run: tools/moo-check-no-clock.sh build/libLuau.VM.a

      - name: sccache stats
        if: always() && steps.cache.outputs.launcher == 'sccache'
        continue-on-error: true
        run: sccache --show-stats

  full:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      - name: sccache probe
        id: cache
        shell: bash
        run: tools/moo-ci-sccache.sh

      - name: configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLUAU_WERROR=ON
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_LAUNCHER=${{ steps.cache.outputs.launcher }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ steps.cache.outputs.launcher }}

      - name: build
        run: cmake --build build --target Luau.Conformance Luau.UnitTest Luau.CLI.Test Luau.Repl.CLI Luau.Analyze.CLI Luau.Compile.CLI

      - name: the compiler across processes, directories and locales
        run: python3 tools/moo-check-compile.py build/moo-compile

      - name: conformance
        run: build/Luau.Conformance

      - name: unit tests
        run: build/Luau.UnitTest

      - name: cli tests
        run: build/Luau.CLI.Test

      - name: layer 3b against fixed3d (BOX3D_FIXED_SATURATE)
        run: tools/moo-fixed3d-compare.sh build clang++

      - name: moo binaries
        run: |
          build/moo --version | grep -E '^moo [0-9]+\.[0-9]+\.[0-9]+ \(Luau [0-9.]+\)$'
          build/moo tests/conformance/assert.luau
          build/moo-analyze tests/conformance/assert.luau
          build/moo-compile tests/conformance/assert.luau > /dev/null

      - name: native codegen is refused
        run: |
          ! build/moo --codegen tests/conformance/assert.luau
          ! build/moo --jit-inliner tests/conformance/assert.luau

  # a checked build raises "number overflow in '<op>'" where release saturates (docs/DESIGN.md "Overflow")
  checked:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      - name: sccache probe
        id: cache
        shell: bash
        run: tools/moo-ci-sccache.sh

      - name: configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLUAU_WERROR=ON -DMOO_OVERFLOW_ERRORS=ON
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_LAUNCHER=${{ steps.cache.outputs.launcher }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ steps.cache.outputs.launcher }}

      - name: build
        run: cmake --build build --target Moo.Test Luau.Conformance Luau.Compile.CLI

      - name: moo tests and the determinism suite
        run: build/Moo.Test

      - name: the compiler across processes, directories and locales
        run: python3 tools/moo-check-compile.py build/moo-compile --pins tests/determinism/bytecode-checked.txt

      - name: conformance
        run: build/Luau.Conformance

  # gcc with warnings as errors
  gcc:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      - name: sccache probe
        id: cache
        shell: bash
        run: tools/moo-ci-sccache.sh

      - name: configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLUAU_WERROR=ON
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_C_COMPILER_LAUNCHER=${{ steps.cache.outputs.launcher }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ steps.cache.outputs.launcher }}

      - name: build
        run: cmake --build build --target Moo.Test Luau.Conformance Luau.Compile.CLI

      - name: moo tests and the determinism suite
        run: build/Moo.Test

      - name: the compiler across processes, directories and locales
        run: python3 tools/moo-check-compile.py build/moo-compile

      - name: conformance
        run: build/Luau.Conformance

  # nightly.yml's macos-arm64, cut to Moo.Test and Conformance; a linker warning is an error (-fatal_warnings)
  macos:
    if: github.event_name != 'push'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      - name: sccache probe
        id: cache
        shell: bash
        run: tools/moo-ci-sccache.sh

      - name: configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLUAU_WERROR=ON
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXE_LINKER_FLAGS=-Wl,-fatal_warnings
          -DCMAKE_C_COMPILER_LAUNCHER=${{ steps.cache.outputs.launcher }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ steps.cache.outputs.launcher }}

      - name: build
        run: cmake --build build --target Moo.Test Luau.Conformance Luau.Compile.CLI

      - name: moo tests and the determinism suite
        run: build/Moo.Test

      - name: the compiler across processes, directories and locales
        run: python3 tools/moo-check-compile.py build/moo-compile

      - name: conformance
        run: build/Luau.Conformance

      - name: sccache stats
        if: always() && steps.cache.outputs.launcher == 'sccache'
        continue-on-error: true
        run: sccache --show-stats

  # nightly.yml's windows-msvc, cut to Moo.Test and Conformance; Ninja in the MSVC environment so sccache can cache
  # (it needs debug information embedded in each object, /Z7)
  windows:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      - name: sccache probe
        id: cache
        shell: bash
        run: tools/moo-ci-sccache.sh

      - name: configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLUAU_WERROR=ON
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER_LAUNCHER=${{ steps.cache.outputs.launcher }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ steps.cache.outputs.launcher }}
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: build
        run: cmake --build build --target Moo.Test Luau.Conformance Luau.Compile.CLI

      - name: moo tests and the determinism suite
        run: build/Moo.Test.exe

      - name: the compiler across processes, directories and locales
        run: python tools/moo-check-compile.py build/moo-compile.exe

      - name: conformance
        run: build/Luau.Conformance.exe

      - name: sccache stats
        if: always() && steps.cache.outputs.launcher == 'sccache'
        continue-on-error: true
        run: sccache --show-stats
