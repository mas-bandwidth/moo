# moo per-commit gate.
#
# The one-minute rule: the required job, push-gate, builds only Moo.Test (moo's own tests and the
# determinism suite, on the VM and the compiler alone) and the VM library, with sccache on the
# GitHub Actions cache, so a commit that changes a VM header rebuilds the VM and nothing else.
# Luau's unmodified suites (Conformance, UnitTest, CLI) run in the full job on pull requests, in
# parallel and not required, and every night on Linux gcc and clang and macOS arm64 (nightly.yml).
name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  push-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLUAU_WERROR=ON
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: build
        run: cmake --build build --target Moo.Test Luau.VM

      - name: moo tests and the determinism suite
        run: build/Moo.Test

      - name: the VM reads no clock
        run: tools/moo-check-no-clock.sh build/libLuau.VM.a

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  full:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLUAU_WERROR=ON
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: build
        run: cmake --build build --target Luau.Conformance Luau.UnitTest Luau.CLI.Test Luau.Repl.CLI Luau.Analyze.CLI Luau.Compile.CLI

      - name: conformance
        run: build/Luau.Conformance

      - name: unit tests
        run: build/Luau.UnitTest

      - name: cli tests
        run: build/Luau.CLI.Test

      - name: moo binaries
        run: |
          build/moo tests/conformance/assert.luau
          build/moo-analyze tests/conformance/assert.luau
          build/moo-compile tests/conformance/assert.luau > /dev/null

      - name: native codegen is refused
        run: |
          ! build/moo --codegen tests/conformance/assert.luau
          ! build/moo --jit-inliner tests/conformance/assert.luau
